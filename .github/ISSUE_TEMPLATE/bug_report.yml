name: Bug report
description: Report a problem with branch, branch-mcp, or the viewer
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: cli
    attributes:
      label: Which AI CLI were you using?
      options:
        - Claude Code
        - OpenAI Codex CLI
        - Google Gemini CLI
        - Factory.ai Droid
        - Not applicable (viewer / MCP / other)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: branch-ai version
      description: Output of `branch --version` or the version in package.json
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "node --version"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. branch "..."
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      render: shell
